<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kanishka 🌹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- LOCK -->
<div id="lock">
  <div class="lock-box">
    <span class="lock-ornament">🌹</span>
    <h2>A Private Letter</h2>
    <span class="auth-label">For Kanishka</span>
    <input type="password" id="pass" placeholder="enter the password">
    <button type="button" onclick="unlock()">Open</button>
  </div>
</div>

<!-- MAIN -->
<div class="container" id="main">
  <div class="card slide" id="card"></div>
</div>

<script src="script.js"></script>
</body>
</html>
